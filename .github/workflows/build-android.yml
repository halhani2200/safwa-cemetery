name: Build Android APK & AAB

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/patch-android-signing.js'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Hoisted to job level so step-level `if` conditions can evaluate it
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: app
        run: npm ci || npm install

      - name: Add Android platform (if not present)
        working-directory: app
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy Firebase google-services.json
        working-directory: app
        run: |
          if [ -f "firebase/google-services.json" ]; then
            mkdir -p android/app
            cp firebase/google-services.json android/app/google-services.json
            echo "✓ Firebase config copied"
          else
            echo "⚠ No google-services.json found — push notifications disabled in this build"
          fi

      - name: Generate app icons and splash from resources
        working-directory: app
        run: |
          if [ -f "resources/icon.png" ] && [ -f "resources/splash.png" ]; then
            npx @capacitor/assets generate --android \
              --iconBackgroundColor "#0E4D3F" \
              --iconBackgroundColorDark "#08362C" \
              --splashBackgroundColor "#0E4D3F" \
              --splashBackgroundColorDark "#08362C" || echo "Asset generation skipped"
          fi

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Patch Android gradle for release signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: node scripts/patch-android-signing.js

      - name: Decode keystore and write keystore.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/release.keystore
          cat > app/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build debug APK (always works, for testing)
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release AAB (signed)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: app/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify AAB exists
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          AAB=app/android/app/build/outputs/bundle/release/app-release.aab
          if [ -f "$AAB" ]; then
            echo "✓ AAB built at $AAB ($(du -h $AAB | cut -f1))"
          else
            echo "✗ AAB not found at $AAB"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: safwa-cemetery-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: safwa-cemetery-release-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
