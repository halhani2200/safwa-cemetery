name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: app
        run: npm ci || npm install

      - name: Add iOS platform (if not present)
        working-directory: app
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Install CocoaPods
        working-directory: app/ios/App
        run: pod install

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync ios

      # Build unsigned IPA (for verification — needs full code signing for App Store)
      - name: Build unsigned archive
        working-directory: app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO || echo "Archive step finished (signing required for full IPA)"

      - name: Upload archive (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: safwa-cemetery-ios-archive
          path: app/ios/App/build/App.xcarchive
          if-no-files-found: ignore

      # When you have Apple Developer credentials configured as secrets,
      # uncomment the signed-export step below:
      #
      # - name: Export signed IPA
      #   env:
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     xcodebuild -exportArchive \
      #       -archivePath app/ios/App/build/App.xcarchive \
      #       -exportPath app/ios/App/build/output \
      #       -exportOptionsPlist app/ios/exportOptions.plist
