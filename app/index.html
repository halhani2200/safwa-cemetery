<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>مقبرة صفوى</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E4D3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/js/native-bridge.js"></script>
<link rel="stylesheet" href="/app/app.css">
<style>
/* App root sizing for full-viewport mobile shell */
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg,#F7F2E6)}
/* Lock the document so only .screen-body scrolls (kills iOS rubber-band bounce of the whole app/header). */
body{position:fixed;inset:0;width:100%;overscroll-behavior:none}
#app{height:100%;position:relative;overflow:hidden}
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
/* Bottom nav pinned to bottom (screen is absolute, so nav must be too) */
.app .bottom-nav{position:absolute;left:0;right:0;bottom:0;z-index:10}
#screenHost{position:absolute;inset:0}
/* status bar text in header */
.appbar-status{font-size:11px;opacity:.85;display:flex;align-items:center;gap:4px}
.appbar-status .d{width:6px;height:6px;border-radius:50%;background:#86EFAC}
.appbar-status .d.closed{background:#FCA5A5}
/* On This Day card */
.otd-card{background:linear-gradient(180deg,#ffffff,#FBF8F0);border:1px solid var(--line,#E7DCC4);border-radius:16px;padding:14px 14px 12px;box-shadow:var(--sh-1,0 2px 8px rgba(0,0,0,.05))}
.otd-head{display:flex;align-items:center;gap:8px;color:var(--green,#0E4D3F);font-family:var(--font-display,inherit);font-weight:700;font-size:14px;margin-bottom:8px}
.otd-head .otd-date{margin-inline-start:auto;font-weight:600;font-size:12px;color:var(--gold,#B8860B)}
.otd-list{display:flex;flex-direction:column;gap:2px}
.otd-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;cursor:pointer}
.otd-row:active{background:var(--bg-2,#F3EEE2)}
.otd-ico{width:34px;height:34px;border-radius:10px;background:#EAF1EE;color:var(--green,#0E4D3F);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.otd-ico.female{background:#F3E8FF;color:#6B21A8}
.otd-name{font-size:14px;font-weight:600;color:var(--text,#1F2937);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otd-empty{text-align:center;font-family:var(--font-display,inherit);color:var(--muted,#6B7280);font-size:14px;padding:10px 6px}
.otd-fatiha{width:100%;margin-top:10px;background:var(--green,#0E4D3F);color:#fff;border:none;border-radius:12px;min-height:42px;font-family:inherit;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
.otd-fatiha:active{opacity:.9}
/* Death-report button + wizard */
.report-btn{display:inline-flex;align-items:center;gap:5px;background:var(--gold,#B8860B);color:#fff;border:none;border-radius:999px;padding:7px 12px;font-family:inherit;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.report-btn:active{opacity:.9}
.rfield{margin-bottom:14px}
.rfield label{display:block;font-size:13px;font-weight:600;color:var(--text,#1F2937);margin-bottom:6px}
.rfield input,.rfield select{width:100%;height:48px;border-radius:14px;border:1px solid var(--line,#E2D9C5);background:#fff;padding:0 14px;font-size:14px;font-family:inherit;color:var(--text,#1F2937);outline:none;box-sizing:border-box}
.rfield input:focus,.rfield select:focus{border-color:var(--green,#0E4D3F)}
.rhint{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted,#6B7280);margin-top:6px}
.rtile{display:flex;align-items:center;gap:12px;background:#fff;border:1px dashed var(--line,#E2D9C5);border-radius:14px;padding:14px;cursor:pointer}
.rtile.up{background:var(--green-50,#EAF1EE);border-style:solid;border-color:var(--green,#0E4D3F)}
.rtile-ic{width:44px;height:44px;border-radius:12px;background:var(--bg-2,#F3EEE2);color:var(--muted,#6B7280);display:grid;place-items:center;flex-shrink:0}
.rtile.up .rtile-ic{background:var(--green,#0E4D3F);color:#fff}
.rtile-t{font-size:14px;font-weight:600;color:var(--text,#1F2937)}
.rtile-h{font-size:11.5px;color:var(--muted,#6B7280);margin-top:2px}
.rprivacy{display:flex;align-items:flex-start;gap:10px;background:var(--green-50,#EAF1EE);border:1px solid rgba(14,77,63,.10);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:12px;color:var(--green-dark,#08362C);line-height:1.65}
.rprivacy b{font-weight:600}
.rinfo{display:flex;align-items:flex-start;gap:8px;background:#FBF3DE;border:1px solid rgba(184,134,11,.15);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:#7A5A0A;line-height:1.6}
.rcontact{display:flex;align-items:center;gap:10px;background:var(--bg-2,#F3EEE2);border:1px solid var(--line,#E2D9C5);border-radius:12px;padding:10px 12px;margin-top:8px}
.rcontact-ic{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--green,#0E4D3F);display:grid;place-items:center;flex-shrink:0}
.rcontact-btn{width:36px;height:36px;border-radius:10px;border:none;background:var(--green,#0E4D3F);color:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.btn-secondary{background:var(--bg-2,#F3EEE2);color:var(--text,#1F2937);border:1px solid var(--line,#E2D9C5)}
/* Rich announcement card */
.ann-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ann-rahima{font-family:var(--font-display,inherit);color:var(--gold,#B8860B);font-size:13px;font-weight:600}
.ann-name{font-family:var(--font-display,inherit);font-size:17px;font-weight:700;color:var(--green,#0E4D3F);margin:0}
.ann-sub{font-size:12px;color:var(--muted,#6B7280);margin:2px 0 10px}
.ann-row{display:flex;gap:10px;padding:5px 0;font-size:13px;align-items:baseline}
.ann-lbl{color:var(--muted,#6B7280);min-width:64px;flex-shrink:0;font-size:12px}
.ann-val{color:var(--text,#1F2937);font-weight:500;flex:1}
.ann-aza{background:var(--bg-2,#F7F2E6);border-radius:12px;padding:6px 12px;margin-top:8px}
.ann-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ann-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line,#E2D9C5);background:#fff;color:var(--text,#1F2937);border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:600;font-size:12.5px;cursor:pointer}
.ann-btn.primary{background:var(--green,#0E4D3F);color:#fff;border-color:var(--green,#0E4D3F)}
.ann-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.ann-chip{border:1px solid var(--line,#E2D9C5);background:#fff;color:var(--muted,#6B7280);border-radius:999px;padding:7px 14px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.ann-chip.on{background:var(--green,#0E4D3F);color:#fff;border-color:var(--green,#0E4D3F)}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ============================================================
//  Safwa Cemetery — Native App Shell (vanilla, wired to real API)
//  Design system: app.css | Icons: inline SVG (Lucide-style)
// ============================================================

// ---------- SVG Icons ----------
const svg = (paths, sz=20, sw=1.75) =>
  `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
const I = {
  search:(s)=>svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',s),
  map:(s)=>svg('<path d="M9 4l-6 2v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',s),
  megaphone:(s)=>svg('<path d="M3 11v2a2 2 0 0 0 2 2h1l4 4V5l-4 4H5a2 2 0 0 0-2 2z"/><path d="M14 7a5 5 0 0 1 0 10"/><path d="M18 4a9 9 0 0 1 0 16"/>',s),
  more:(s)=>svg('<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>',s),
  nav:(s)=>svg('<polygon points="3 11 22 2 13 21 11 13 3 11"/>',s),
  share:(s)=>svg('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/>',s),
  flag:(s)=>svg('<path d="M4 22V4"/><path d="M4 4h13l-2 4 2 4H4"/>',s),
  back:(s)=>svg('<polyline points="15 18 9 12 15 6"/>',s),
  forward:(s)=>svg('<polyline points="9 18 15 12 9 6"/>',s),
  close:(s)=>svg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',s),
  plus:(s)=>svg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',s),
  mic:(s)=>svg('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/>',s),
  pin:(s)=>svg('<path d="M20 10c0 7-8 12-8 12s-8-5-8-12a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="3"/>',s),
  person:(s)=>svg('<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',s),
  calendar:(s)=>svg('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',s),
  mosque:(s)=>svg('<path d="M12 2c-2 3 1 4 0 7"/><path d="M3 22V11a9 9 0 0 1 18 0v11"/><path d="M3 22h18"/><line x1="9" y1="22" x2="9" y2="14"/><line x1="15" y1="22" x2="15" y2="14"/>',s),
  phone:(s)=>svg('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',s),
  whatsapp:(s)=>svg('<path d="M21 11.5a8.4 8.4 0 0 1-1.3 4.5L21 21l-5.2-1.5a8.4 8.4 0 1 1 5.2-8z"/>',s,1.6),
  bell:(s)=>svg('<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',s),
  check:(s)=>svg('<polyline points="20 6 9 17 4 12"/>',s),
  info:(s)=>svg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.5" fill="currentColor"/>',s),
  alert:(s)=>svg('<path d="M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/>',s),
  compass:(s)=>svg('<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',s),
  lock:(s)=>svg('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',s),
  user:(s)=>svg('<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',s),
  image:(s)=>svg('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',s),
  clock:(s)=>svg('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',s),
  shield:(s)=>svg('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',s),
  users:(s)=>svg('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',s),
  heart:(s)=>svg('<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',s),
  beads:(s)=>svg('<circle cx="12" cy="6" r="2"/><circle cx="6" cy="9" r="1.5"/><circle cx="18" cy="9" r="1.5"/><circle cx="4" cy="15" r="1.5"/><circle cx="20" cy="15" r="1.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="15" cy="19" r="1.5"/>',s),
  grave:(s)=>`<svg width="${s||26}" height="${s||26}" viewBox="0 0 24 24" fill="none"><path d="M6 22V11a6 6 0 1 1 12 0v11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="6" y1="22" x2="18" y2="22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="9" y1="13.5" x2="15" y2="13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  arch:(s)=>`<svg width="${s||26}" height="${s||26}" viewBox="0 0 24 24" fill="none"><path d="M5 22V12a7 7 0 0 1 14 0v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="5" y1="22" x2="19" y2="22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="11" r="1.4" fill="currentColor"/></svg>`,
  crest:(s,c)=>`<svg width="${s||56}" height="${s||56}" viewBox="0 0 64 64" fill="none"><path d="M32 6 L52 14 V32 C52 44 44 54 32 58 C20 54 12 44 12 32 V14 L32 6z" stroke="${c||'#D4A93A'}" stroke-width="1.6"/><path d="M32 18 a8 8 0 0 1 8 8 v14 h-16 v-14 a8 8 0 0 1 8-8z" stroke="${c||'#D4A93A'}" stroke-width="1.4"/><line x1="24" y1="46" x2="40" y2="46" stroke="${c||'#D4A93A'}" stroke-width="1.4" stroke-linecap="round"/><circle cx="32" cy="14" r="1.5" fill="${c||'#D4A93A'}"/></svg>`,
};

// ---------- Helpers ----------
const esc = (s) => s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (s) => { if(!s)return''; const p=String(s).trim().split(/[\/\-\\.]/); if(p.length!==3)return s; const[d,m,y]=p.map(x=>x.trim()); if(!/^\d+$/.test(d)||!/^\d+$/.test(m)||!/^\d+$/.test(y))return s; return `${d.padStart(2,'0')} / ${m.padStart(2,'0')} / ${y}`; };
const timeAgo = (ts) => { if(!ts)return''; const d=new Date(ts),diff=(Date.now()-d.getTime())/1000; if(diff<60)return'الآن'; if(diff<3600)return Math.floor(diff/60)+' د'; if(diff<86400)return Math.floor(diff/3600)+' س'; if(diff<604800)return Math.floor(diff/86400)+' ي'; return d.toLocaleDateString('ar-EG'); };
const isFresh = (ts) => ts && (Date.now()-new Date(ts).getTime())<86400000;
async function api(path){ try{const h={};if(state.token)h['Authorization']='Bearer '+state.token;const r=await fetch((window.API_BASE||'')+path,{credentials:'include',headers:h});return await r.json();}catch(e){return{error:e.message};} }

// ---------- App State ----------
const state = { tab:'home', stack:[], graves:null, announcements:null, banner:null, stats:null, onThisDay:null, otdToday:null, auth:null, panelStats:null, token:null };
// Death-report entry is FULLY DISABLED for the first store release (no sensitive data collected,
// simplifies Play Data Safety). Re-enable later — once Hosseiniya contacts + staff review are ready —
// by restoring the flag check below. Feature code is intact; only this gate is hard-off.
//   previously: /[?&]report=1/.test(location.search) || localStorage.getItem('safwa_report')==='1'
window.REPORT_ENABLED = false;

// ---------- Toast ----------
function toast(msg, kind){
  let t=document.getElementById('appToast');
  if(!t){t=document.createElement('div');t.id='appToast';t.className='toast';document.getElementById('app').appendChild(t);}
  t.innerHTML = `<span class="ico">${I.info(16)}</span><span>${esc(msg)}</span>`;
  t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2600);
}

// ---------- Status (visit hours) ----------
function visitStatus(){
  const now=new Date(),h=now.getHours()+now.getMinutes()/60,day=now.getDay();
  const morning=[4,5,6].includes(day); const start=morning?5.5:12; const end=17.83;
  return (h>=start&&h<end);
}

// ============================================================
//  SCREENS
// ============================================================
function appbar(title, sub, opts={}){
  const left = opts.back
    ? `<button class="appbar-icon" onclick="back()">${I.back(20)}</button>`
    : `<div class="appbar-logo">${I.crest(20,'currentColor')}</div>`;
  const right = opts.noBell ? '<div style="width:38px"></div>'
    : `<button class="appbar-icon" id="bellBtn" onclick="onBell()">${I.bell(20)}</button>`;
  return `<div class="appbar ${opts.cream?'cream':''}">
    ${left}
    <div class="appbar-title">${esc(title)}${sub?`<span class="appbar-sub">${esc(sub)}</span>`:''}</div>
    ${right}
  </div>`;
}

// ---- On This Day ----
function otdRow(g){
  const f=g.gender==='انثى';
  const ya=g.years_ago!=null?`<span style="color:var(--gold);font-size:12px;font-weight:600">منذ ${g.years_ago} سنة</span>`:'';
  const greg=g.death_date_gregorian?`<span style="font-size:11px;color:var(--muted)">${esc(fmtDate(g.death_date_gregorian))}م</span>`:'';
  return `<div class="otd-row" onclick="openDetail(${g.id})">
    <div class="otd-ico ${f?'female':''}">${f?I.arch(18):I.grave(18)}</div>
    <div style="flex:1;min-width:0"><div class="otd-name">${esc(g.name)}</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:2px">${ya}${greg}</div></div>
    <span class="chev">${I.forward(15)}</span>
  </div>`;
}
function onThisDayHtml(){
  if(state.onThisDay===null) return `<div class="otd-card"><div class="otd-head">${I.beads(16)}<span>في مثل هذا اليوم</span></div><div class="skel" style="height:56px;border-radius:12px"></div></div>`;
  const list=state.onThisDay;
  const dateLabel=state.otdToday&&state.otdToday.label?`<span class="otd-date">${esc(state.otdToday.label)}</span>`:'';
  if(list.length===0) return `<div class="otd-card"><div class="otd-head">${I.beads(16)}<span>في مثل هذا اليوم</span>${dateLabel}</div><div class="otd-empty">رحم الله موتانا وموتى المسلمين</div></div>`;
  const rows=list.slice(0,3).map(otdRow).join('');
  const more=list.length>3?`<div style="text-align:center;font-size:12px;color:var(--muted);padding-top:4px">و${list.length-3} آخرين رحمهم الله</div>`:'';
  return `<div class="otd-card"><div class="otd-head">${I.beads(16)}<span>في مثل هذا اليوم</span>${dateLabel}</div><div class="otd-list">${rows}${more}</div><button class="otd-fatiha" onclick="readFatiha()">${I.beads(15)} قراءة الفاتحة لهم جميعاً</button></div>`;
}

// ---- Home ----
function renderHome(){
  const open = visitStatus();
  const slides = (state.banner||[]);
  const annHtml = (state.announcements===null)
    ? `<div class="skel" style="height:88px;border-radius:14px"></div>`
    : (state.announcements.length===0
        ? `<div class="empty" style="padding:24px"><div class="ico">${I.heart(22)}</div><p>لا يوجد إعلانات حالياً</p></div>`
        : state.announcements.slice(0,2).map(a=>annCard(a,true)).join(''));

  return `<div class="screen">
    <div class="appbar">
      <div class="appbar-logo">${I.crest(20,'currentColor')}</div>
      <div class="appbar-title">مقبرة صفوى<span class="appbar-sub">السلام عليكم ورحمة الله</span></div>
      ${window.REPORT_ENABLED?`<button class="report-btn" onclick="openReport()">${I.plus(14)}<span>إبلاغ وفاة</span></button>`:''}
      <button class="appbar-icon" id="bellBtn" onclick="onBell()">${I.bell(20)}</button>
    </div>
    <div class="screen-body" style="padding:12px 16px 16px">

  </div>`;

let bannerTimer=null;
function startBanner(){
  clearInterval(bannerTimer);
  const el=document.getElementById('bannerEl'); if(!el)return;
  const slides=el.querySelectorAll('.banner-slide'); if(slides.length<2)return;
  const dots=el.querySelectorAll('.banner-dots i'); let idx=0;
  bannerTimer=setInterval(()=>{
    slides[idx].classList.remove('is-active'); if(dots[idx])dots[idx].classList.remove('on');
    idx=(idx+1)%slides.length;
    slides[idx].classList.add('is-active'); if(dots[idx])dots[idx].classList.add('on');
  },5500);
}

function reportCapture(s){ const g=id=>document.getElementById(id),d=state.reportData;
  if(s===1){ if(g('rf_rname'))d.reporter_name=g('rf_rname').value.trim(); if(g('rf_rel'))d.reporter_relation=g('rf_rel').value; if(g('rf_rnid'))d.reporter_nid=g('rf_rnid').value.trim(); if(g('rf_rphone'))d.reporter_phone=g('rf_rphone').value.trim(); }
  else if(s===2){ if(g('rf_dname'))d.deceased_name=g('rf_dname').value.trim(); if(g('rf_dhijri'))d.death_date_hijri=g('rf_dhijri').value.trim(); if(g('rf_dage'))d.deceased_age=g('rf_dage').value.trim(); }
  else if(s===4){ if(g('rf_azamen'))d.aza_men=g('rf_azamen').value; if(g('rf_azawomen'))d.aza_women=g('rf_azawomen').value; }
}
function reportGender(g){ reportCapture(2); state.reportData.deceased_gender=g; render(); }
function reportVenue(){ reportCapture(4); render(); }
function reportPick(kind){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*,application/pdf'; inp.onchange=()=>{ if(inp.files&&inp.files[0]){ state.reportData.files[kind]=inp.files[0]; render(); } }; inp.click(); }
function reportNext(){ const s=state.reportStep; reportCapture(s);
  if(s===1&&(!state.reportData.reporter_name||!state.reportData.reporter_phone)){ toast('الاسم ورقم الجوال مطلوبان'); return; }
  if(s===2&&!state.reportData.deceased_name){ toast('اسم المتوفّى مطلوب'); return; }
  if(s===3&&(!state.reportData.files.permit||!state.reportData.files.id)){ toast('ارفع تصريح الدفن وهوية المتوفّى'); return; }
  state.reportStep=s+1; render();
}
function reportBack(){ const s=state.reportStep; if(s===1||s==='done'){ back(); return; } reportCapture(s); state.reportStep=s-1; render(); }
async function reportSubmit(){ reportCapture(4); const d=state.reportData;
  if(!d.reporter_name||!d.reporter_phone||!d.deceased_name){ toast('أكمل البيانات المطلوبة'); return; }
  toast('⏳ جاري إرسال البلاغ...');
  const payload={reporter_name:d.reporter_name,reporter_relation:d.reporter_relation,reporter_phone:d.reporter_phone,reporter_nid:d.reporter_nid,deceased_name:d.deceased_name,deceased_gender:d.deceased_gender,deceased_age:d.deceased_age||null,aza_men:d.aza_men||null,aza_women:d.aza_women||null};
  let res; try{ res=await (await fetch((window.API_BASE||'')+'/api/death-reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})).json(); }catch(e){ res={error:'فشل الاتصال'}; }
  if(!res||!res.ok){ toast('❌ '+((res&&res.error)||'تعذّر الإرسال')); return; }
  for(const kind of Object.keys(d.files||{})){ const f=d.files[kind]; if(!f)continue; const fd=new FormData(); fd.append('file',f); fd.append('kind',kind==='permit'?'تصريح الدفن':'هوية المتوفّى'); try{ await fetch((window.API_BASE||'')+'/api/death-reports/'+res.id+'/documents?token='+encodeURIComponent(res.edit_token),{method:'POST',body:fd}); }catch(e){} }
  state.reportRef=res.ref; state.reportStep='done'; render();
}
window.openReport=openReport; window.reportNext=reportNext; window.reportBack=reportBack; window.reportPick=reportPick; window.reportGender=reportGender; window.reportVenue=reportVenue; window.reportSubmit=reportSubmit;

// ============================================================
//  Staff / Admin — in-app panel (hidden long-press entrance)
//  Native login + role dashboard. Management actions open the
//  existing /staff and /admin pages IN-APP (same-origin nav,
//  never an external browser). Auth = session cookie (web/Android).
//  iOS native (cross-origin) will use a token — added before iOS rebuild.
// ============================================================
const ROLE_LABEL={admin:'مدير',staff:'موظف',volunteer:'متطوّع'};
async function apiSend(path, method, body){
  try{
    const h=body?{'Content-Type':'application/json'}:{}; if(state.token)h['Authorization']='Bearer '+state.token;
    const r=await fetch((window.API_BASE||'')+path,{method:method||'POST',headers:h,credentials:'include',body:body?JSON.stringify(body):undefined});
    const d=await r.json().catch(()=>({})); return {ok:r.ok,status:r.status,data:d};
  }catch(e){ return {ok:false,status:0,data:{error:e.message}}; }
}

// ---- Login screen (native) ----
function renderLogin(){
  return `<div class="screen no-nav">
    ${appbar('دخول الموظفين','منطقة خاصة',{back:true,noBell:true})}
    <div class="screen-body" style="padding:26px 18px">
      <div style="text-align:center;margin:6px 0 22px">
        <div style="width:74px;height:74px;margin:0 auto 14px;display:grid;place-items:center;background:var(--green-50,#EAF1EE);border-radius:22px;color:var(--green,#0E4D3F)">${I.lock(32)}</div>
        <div style="font-size:13px;color:var(--muted)">سجّل دخولك بحساب الموظف أو المدير</div>
      </div>
      <div class="rfield"><label>اسم المستخدم</label><input id="lg_user" autocomplete="username" autocapitalize="none" placeholder="اسم المستخدم"></div>
      <div class="rfield"><label>كلمة المرور</label><input id="lg_pass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div id="lg_err" style="display:none;color:var(--danger,#DC2626);font-size:13px;margin:-4px 0 12px;text-align:center"></div>
      <button class="btn btn-primary" id="lg_btn" onclick="doLogin()" style="width:100%">دخول</button>
    </div>
  </div>`;
}
async function doLogin(){
  const u=(document.getElementById('lg_user')?.value||'').trim();
  const p=(document.getElementById('lg_pass')?.value||'');
  const err=document.getElementById('lg_err'),btn=document.getElementById('lg_btn');
  const fail=(m)=>{ if(err){err.textContent=m;err.style.display='block';} if(btn){btn.disabled=false;btn.textContent='دخول';} };
  if(!u||!p){ fail('أدخل اسم المستخدم وكلمة المرور'); return; }
  if(btn){btn.disabled=true;btn.textContent='جارٍ الدخول…';}
  const res=await apiSend('/api/auth/login','POST',{username:u,password:p});
  if(res.ok&&res.data&&res.data.user){ state.auth=res.data.user; state.token=res.data.token||state.token||null; if(state.token){try{localStorage.setItem('safwa_token',state.token);}catch(e){}} state.panelStats=null; state.stack=['panel']; render(); loadPanelStats(); }
  else fail((res.data&&res.data.error)||'بيانات الدخول غير صحيحة');
}
async function doLogout(){ try{ await apiSend('/api/auth/logout','POST'); }catch(e){} state.auth=null; state.token=null; try{localStorage.removeItem('safwa_token');}catch(e){} state.panelStats=null; state.stack=[]; state.tab='home'; render(); toast('تم تسجيل الخروج'); }

async function loadPanelStats(){
  const s=await api('/api/stats'); state.panelStats=s||{};
  const v=state.stack[state.stack.length-1]; if(v==='panel') render();
}

function setupHiddenEntrance(){

  const move=(e)=>{ if(timer&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)){ clearTimeout(timer); timer=null; } };

async function agPhoto(mode){
  const ag=agState();
  if(mode==='retake'){ ag.photo=null; const b=document.getElementById('ag_photoBox'); if(b)b.innerHTML=agPhotoHTML(); return; }
  if(window.SafwaNative&&window.SafwaNative.isNative&&window.SafwaNative.takePhoto){
    const r=await window.SafwaNative.takePhoto({source:mode==='gallery'?'PHOTOS':'CAMERA',quality:75,maxWidth:1280,maxHeight:1280});
    if(r&&r.success){ ag.photo=r.dataUrl; const b=document.getElementById('ag_photoBox'); if(b)b.innerHTML=agPhotoHTML(); }
    else if(r&&!r.cancelled){ toast('❌ '+(r.error||'تعذّر فتح الكاميرا')); }
    return;
  }
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; if(mode==='camera')inp.capture='environment';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f)return; const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); const mw=1280,sc=img.width>mw?mw/img.width:1; c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); ag.photo=c.toDataURL('image/jpeg',0.8); const b=document.getElementById('ag_photoBox'); if(b)b.innerHTML=agPhotoHTML(); }; img.src=fr.result; }; fr.readAsDataURL(f); };
  inp.click();
}
async function agAI(){

  const s=document.getElementById('ag_ai'); if(s){s.style.display='block';s.style.color='var(--muted)';s.textContent='⏳ الذكاء الاصطناعي يقرأ الشاهد...';}
  const res=await apiSend('/api/ai/extract-tombstone','POST',{image:ag.photo});
  const d=res.data||{};

  }
}
async function agGPS(){
  const ag=agState();
  const st=document.getElementById('ag_gpsText'),co=document.getElementById('ag_gpsCoords'),btn=document.getElementById('ag_gpsBtn');
  if(!window.SafwaNative||!window.SafwaNative.getCurrentPosition){ if(st)st.textContent='GPS غير متاح'; return; }
  if(btn)btn.disabled=true; if(st)st.textContent='⏳ جاري التحديد... (0/5)'; ag.readings=[];
  for(let i=0;i<5;i++){
    const r=await window.SafwaNative.getCurrentPosition();
    if(r&&r.success){ ag.readings.push({lat:r.latitude,lng:r.longitude,acc:r.accuracy}); if(st)st.textContent='⏳ جاري التحديد... ('+(i+1)+'/5)'; }
    await new Promise(x=>setTimeout(x,600));
  }
  if(btn)btn.disabled=false;
  if(!ag.readings.length){ if(st)st.textContent='❌ فشل تحديد الموقع — حاول مرة ثانية'; return; }
  const sorted=ag.readings.slice().sort((a,b)=>a.acc-b.acc).slice(0,3);
  const lat=sorted.reduce((s,r)=>s+r.lat,0)/sorted.length,lng=sorted.reduce((s,r)=>s+r.lng,0)/sorted.length,acc=sorted.reduce((s,r)=>s+r.acc,0)/sorted.length;
  ag.gps={lat,lng,accuracy:acc};
  if(st)st.textContent=acc<=10?'✅ موقع دقيق':acc<=25?'⚠️ دقة متوسطة — تحقّق':'⚠️ دقة ضعيفة — أعد التحديد';
  if(co)co.innerHTML=`<span style="font-family:monospace">${lat.toFixed(6)}, ${lng.toFixed(6)}</span> · دقة ${Math.round(acc)}م (${ag.readings.length} قراءات) · <a onclick="openExt('https://www.google.com/maps?q=${lat},${lng}&z=20')" style="color:var(--green,#0E4D3F)">🗺️ تحقّق</a>`;
  if(btn)btn.textContent='↻ إعادة التحديد';
  agAutoFill(lat,lng);
}
function agAutoFill(lat,lng){
  const C={nw:{lat:26.649576,lng:49.958884},ne:{lat:26.649639,lng:49.959215},sw:{lat:26.649334,lng:49.958942},se:{lat:26.649388,lng:49.959267}};
  const minLat=Math.min(C.sw.lat,C.se.lat)-5e-5,maxLat=Math.max(C.nw.lat,C.ne.lat)+5e-5,minLng=Math.min(C.nw.lng,C.sw.lng)-5e-5,maxLng=Math.max(C.ne.lng,C.se.lng)+5e-5;
  if(lat<minLat||lat>maxLat||lng<minLng||lng>maxLng)return;
  const v=1-(lat-C.sw.lat)/((C.nw.lat+C.ne.lat)/2-(C.sw.lat+C.se.lat)/2+1e-6);
  const u=(lng-(C.nw.lng+C.sw.lng)/2)/((C.ne.lng+C.se.lng)/2-(C.nw.lng+C.sw.lng)/2+1e-6);
  const row=Math.max(1,Math.min(11,Math.round(v*10+1))),grave=Math.max(1,Math.min(17,Math.round(u*16+1)));
  const sEl=document.getElementById('ag_section'),rEl=document.getElementById('ag_row'),nEl=document.getElementById('ag_num');
  if(sEl)sEl.value='أ'; if(rEl&&!rEl.value)rEl.value=row; if(nEl&&!nEl.value)nEl.value=grave; agCheckDup();
}

function agCheckDup(){
  const w=document.getElementById('ag_dup'); if(!w)return;
  const s=((document.getElementById('ag_section')||{}).value||'').trim(),r=(document.getElementById('ag_row')||{}).value,n=(document.getElementById('ag_num')||{}).value;
  if(!s||!r||!n||!state.agGraves){ w.style.display='none'; return; }
  const ex=state.agGraves.find(g=>g.section===s&&String(g.row_number)===String(r)&&String(g.grave_number)===String(n));
  if(ex){ w.style.display='block'; w.innerHTML='⚠️ هذا الموقع ('+esc(s)+'-'+esc(r)+'-'+esc(n)+') مسجّل باسم: '+esc(ex.name)+'. تأكّد أنه ليس تكراراً.'; } else w.style.display='none';

  else { const it=(d.results)||[]; body=it.length? `<div style="display:flex;flex-direction:column;gap:8px">${it.map(a=>`<div style="background:#fff;border:1px solid var(--line,#eee);border-radius:14px;padding:12px"><div style="display:flex;align-items:center;gap:8px"><div style="font-weight:700;color:var(--green,#0E4D3F);flex:1">${esc(a.deceased_name||a.name||'')}</div>${(state.auth&&state.auth.role==='admin')?`<button class="btn btn-secondary" style="padding:4px 10px;min-height:auto;color:var(--danger,#DC2626);font-size:12px" onclick="annDelete(${a.id})">حذف</button>`:''}</div>${a.funeral_info?`<div style="font-size:12px;color:var(--muted);margin-top:3px">الصلاة: ${esc(a.funeral_info)}</div>`:''}<div style="font-size:11px;color:var(--muted-2);margin-top:3px">${timeAgo(a.created_at)}</div></div>`).join('')}</div>` : `<div class="empty" style="padding:30px"><div class="ico">${I.megaphone(22)}</div><p>لا يوجد إعلانات</p></div>`; }

async function annSave(){
  const v=id=>(document.getElementById(id)||{}).value;
  const name=(v('an_name')||'').trim(); if(!name){ toast('❌ اسم المتوفّى مطلوب'); return; }

function roleBadge(r){ const c={admin:'#0E4D3F',staff:'#B8860B',volunteer:'#6B7280'}; return `<span style="background:${c[r]||'#888'};color:#fff;font-size:11px;padding:3px 10px;border-radius:999px">${ROLE_LABEL[r]||r}</span>`; }

// ---- المستخدمون (users: list + add + role + delete) — admin ----
function openUsersManage(){ state.mgUsers=null; mgLoad('mgUsers','/api/users'); push('usersManage'); }
function renderUsersManage(){
  const d=state.mgUsers; let body;

  return mgScreen('المستخدمون والصلاحيات','إضافة موظفين وتغيير الأدوار',`<button class="btn btn-primary" style="width:100%;margin-bottom:14px" onclick="push('userForm')">${I.plus(16)} إضافة مستخدم</button>${body}`);
}
function renderUserForm(){
  return mgScreen('إضافة مستخدم','',`
    ${mgField('اسم المستخدم *',`<input id="us_user" autocapitalize="none" placeholder="username">`)}
    ${mgField('الاسم الكامل',`<input id="us_name" placeholder="الاسم">`)}

    <button class="btn btn-primary" style="width:100%;margin-top:6px" onclick="userSave()">➕ إنشاء المستخدم</button>`);
}
async function userSave(){
  const v=id=>(document.getElementById(id)||{}).value;
  const u=(v('us_user')||'').trim(), p=(v('us_pass')||'');
  if(!u||!p){ toast('❌ اسم المستخدم وكلمة المرور مطلوبان'); return; }
  if(p.length<12){ toast('❌ كلمة المرور ١٢ حرف على الأقل'); return; }
  const r=await apiSend('/api/users','POST',{username:u,password:p,full_name:(v('us_name')||'').trim()||null,role:v('us_role')||'volunteer'});
  if(r.ok&&r.data&&(r.data.ok||r.data.id)){ toast('✅ تم إنشاء المستخدم'); state.mgUsers=null; back(); mgLoad('mgUsers','/api/users'); } else toast('❌ '+((r.data&&r.data.error)||'فشل الإنشاء'));
}
async function userSetRole(id,role){ const r=await apiSend('/api/users/'+id,'PUT',{role}); toast(r.ok&&r.data&&r.data.ok?'✅ تم تغيير الدور':'❌ '+((r.data&&r.data.error)||'فشل')); state.mgUsers=null; mgLoad('mgUsers','/api/users'); }
async function userDelete(id){ if(!confirm('حذف هذا المستخدم؟'))return; const r=await apiSend('/api/users/'+id,'DELETE'); if(r.ok&&r.data&&r.data.ok){ toast('✅ تم الحذف'); state.mgUsers=null; mgLoad('mgUsers','/api/users'); } else toast('❌ '+((r.data&&r.data.error)||'فشل الحذف')); }

// ---- الإعدادات والبانر (settings) — admin ----
function openSettings(){ state.mgSettings=null; mgLoad('mgSettings','/api/settings'); push('settings'); }
function sGet(k){ const s=state.mgSettings||{}; return (s[k]&&s[k].value!=null)?s[k].value:''; }
function renderSettings(){
  if(state.mgSettings==null) return mgScreen('الإعدادات والبانر','',mgLoading());
  return mgScreen('الإعدادات والبانر','المحتوى المتحكَّم به',`
    ${mgField('شريط البانر (كل سطر = شريحة)',`<textarea id="st_banner" rows="4" style="${TA}">${esc(sGet('top_banner_items'))}</textarea>`)}
    ${mgField('نص التنبيه',`<textarea id="st_notice" rows="2" style="${TA}">${esc(sGet('notice_text'))}</textarea>`)}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${mgField('نوع التنبيه',`<select id="st_ntype"><option value="info" ${sGet('notice_type')!=='urgent'?'selected':''}>عادي</option><option value="urgent" ${sGet('notice_type')==='urgent'?'selected':''}>عاجل</option></select>`)}
      ${mgField('تفعيل التنبيه',`<select id="st_nen"><option value="0" ${sGet('notice_enabled')!=='1'?'selected':''}>مغلق</option><option value="1" ${sGet('notice_enabled')==='1'?'selected':''}>مفعّل</option></select>`)}
    </div>
    ${mgField('ملاحظة التذييل',`<input id="st_footer" value="${esc(sGet('footer_note'))}">`)}

async function settingsSave(){
  const v=id=>(document.getElementById(id)||{}).value;
  const r=await apiSend('/api/settings','POST',{ top_banner_items:v('st_banner')||'', notice_text:v('st_notice')||'', notice_type:v('st_ntype')||'info', notice_enabled:v('st_nen')||'0', footer_note:v('st_footer')||'' });
  if(r.ok&&r.data&&r.data.ok){ toast('✅ تم حفظ الإعدادات'); state.banner=null; back(); } else toast('❌ '+((r.data&&r.data.error)||'فشل الحفظ'));
}

// ---- بلاغات الوفاة (death reports) — admin ----
function openReports(){ state.mgReports=null; mgLoad('mgReports','/api/death-reports'); push('reports'); }

  else { const it=(d.results)||[]; body=it.length? `<div style="display:flex;flex-direction:column;gap:8px">${it.map(r=>`<div style="background:#fff;border:1px solid var(--line,#eee);border-radius:14px;padding:12px"><div style="font-weight:600">${esc(r.deceased_name||'-')}</div><div style="font-size:12px;color:var(--muted)">المبلّغ: ${esc(r.reporter_name||'-')} · ${esc(r.reporter_phone||'')}</div><div style="font-size:11px;color:var(--muted-2);margin-top:3px">${timeAgo(r.created_at)}</div></div>`).join('')}</div>` : `<div class="empty" style="padding:30px"><div class="ico">${I.flag(22)}</div><p>لا يوجد بلاغات</p></div>`; }

window.openUsersManage=openUsersManage; window.userSave=userSave; window.userSetRole=userSetRole; window.userDelete=userDelete; window.openSettings=openSettings; window.settingsSave=settingsSave; window.openAudit=openAudit; window.openReports=openReports;

// ============================================================
//  Router
// ============================================================
const TABS=['home','map','announcements','more'];
const RENDER={home:renderHome,map:renderMap,announcements:renderAnnouncements,more:renderMore,search:renderSearch,photos:renderPhotos,contacts:renderContacts,report:renderReport,login:renderLogin,panel:renderPanel,addGrave:renderAddGrave,myGraves:renderMyGraves,editGrave:renderEditGrave,annManage:renderAnnManage,annForm:renderAnnForm,usersManage:renderUsersManage,userForm:renderUserForm,settings:renderSettings,audit:renderAudit,reports:renderReports};

function render(){
  const view=state.stack.length?state.stack[state.stack.length-1]:state.tab;
  const showNav=TABS.includes(view)&&state.stack.length===0;
  document.getElementById('app').innerHTML =
    `<div id="screenHost">${(RENDER[view]||renderHome)()}</div>${showNav?bottomNav():''}`;
  if(view==='home'){ startBanner(); }
  if(view==='search'){ setTimeout(()=>{const si=document.getElementById('searchInput');if(si){si.focus();si.addEventListener('input',()=>{clearTimeout(searchTO);searchTO=setTimeout(doSearch,300);});si.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});}},50); }
  if(view==='addGrave'){ setTimeout(()=>{ ['ag_section','ag_row','ag_num'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',agCheckDup);}); },50); }
}
function go(tab){ state.stack=[]; state.tab=tab; closeDetail(); render(); }
function push(view){ state.stack.push(view); render(); }
function back(){ if(state.stack.length){state.stack.pop();render();} }
window.go=go; window.push=push; window.back=back;
window.openDetail=openDetail; window.closeDetail=closeDetail; window.doSearch=doSearch;
window.shareGrave=shareGrave; window.readFatiha=readFatiha; window.openExt=openExt;
window.onBell=onBell; window.showDuaa=showDuaa; window.toast=toast;

// ============================================================
//  Push (native)
// ============================================================
async function onBell(){
  const btn=document.getElementById('bellBtn');
  if(window.SafwaNative&&window.SafwaNative.isNative){
    toast('⏳ جاري تفعيل الإشعارات...');
    const r=await window.SafwaNative.registerForPush();
    if(r.success){ btn?.classList.add('active'); toast('✅ تم تفعيل الإشعارات'); }
    else toast('❌ '+(r.error||'تعذّر التفعيل'));
  } else { toast('🔔 الإشعارات متاحة في تطبيق الجوال'); }
}
if(window.SafwaNative&&window.SafwaNative.isNative){
  window.SafwaNative.setupPushListeners((n)=>toast('🔔 '+(n.title||'إشعار جديد')));
}

// ============================================================
//  Data loading + Init
// ============================================================
async function loadData(){
  // Announcements
  const ann=await api('/api/announcements');
  state.announcements=ann.results||[];
  // On this day (Hijri day+month match)
  const otd=await api('/api/on-this-day');
  state.onThisDay=otd.results||[];
  state.otdToday=otd.today||null;
  // Banner content (admin-controlled) — matches website fields (public-content.js)
  const pc=await api('/api/public-content');
  const slides=[];
  if(pc&&!pc.error){
    // Notice (if enabled) shown first as a highlighted slide
    if(pc.notice_enabled==='1'&&pc.notice_text&&pc.notice_text.trim()){
      slides.push({label:'تنبيه',type:pc.notice_type==='urgent'?'maintenance':'announcement',text:pc.notice_text.trim()});
    }
    // Top banner items: newline-separated, each non-empty line is its own slide
    if(pc.top_banner_items){
      pc.top_banner_items.split('\n').map(s=>s.trim()).filter(Boolean).forEach(t=>slides.push({label:'',type:'ayah',text:t}));
    }
  }
  state.banner=slides.length?slides:null;
  // re-render current view if home/announcements
  const view=state.stack.length?state.stack[state.stack.length-1]:state.tab;
  if(view==='home'||view==='announcements') render();
}

// initial render + splash
document.getElementById('app').innerHTML=`<div class="splash"><div class="crest">${I.crest(56,'#D4A93A')}</div><h1>مقبرة صفوى</h1><div class="sub">دليل أهالي صفوى لزيارة المتوفين</div><div class="loader">جارٍ التحميل…</div></div>`;
setTimeout(()=>{
  try{ state.token = localStorage.getItem('safwa_token') || null; }catch(e){}
  render();
  setupHiddenEntrance();
  loadData();
  if(window.SafwaNative&&window.SafwaNative.isNative) setTimeout(()=>window.SafwaNative.hideSplash&&window.SafwaNative.hideSplash(),300);
}, 1400);
</script>
