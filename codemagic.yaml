# Codemagic CI/CD — builds, signs and ships the Safwa Cemetery iOS app WITHOUT a Mac.
# Builds the bundled-UI iOS app (no server.url), signs via App Store Connect API key
# (automatic signing), and uploads to TestFlight.

workflows:
  ios-release:
    name: Safwa Cemetery — iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SafwaASC
    environment:
      groups:
        # Add the secure variable IOS_DIST_CERT_KEY_B64 to this group in the
        # Codemagic UI (App settings → Environment variables → group "ios_signing").
        # Value = base64 of the persistent iOS distribution private key (PEM).
        - ios_signing
      vars:
        BUNDLE_ID: "com.safwacemetery.app"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Preflight — verify signing secret is present
        script: |
          # Fail in seconds (not after a ~15-min build) if the persistent signing
          # key secret is missing. Add IOS_DIST_CERT_KEY_B64 to the "ios_signing"
          # group in Codemagic (Environment variables, Secure).
          if [ -z "$IOS_DIST_CERT_KEY_B64" ]; then
            echo "FATAL: secure env var IOS_DIST_CERT_KEY_B64 is not set."
            echo "Add it in Codemagic → Environment variables → group 'ios_signing'"
            echo "(value = base64 of the persistent iOS distribution key), then rebuild."
            exit 1
          fi
          echo "✓ signing key secret present (${#IOS_DIST_CERT_KEY_B64} chars)"

      - name: Install npm dependencies
        script: |
          cd app
          npm ci || npm install

      - name: Add Capgo OTA plugin
        script: |
          cd app
          # Pin to the Capacitor 7-compatible major (latest needs Capacitor 8).
          npm install @capgo/capacitor-updater@^7 --legacy-peer-deps

      - name: Prepare iOS config (bundle local UI + Capgo)
        script: |
          cd app
          node scripts/ios-prepare.js

      - name: Bundle web UI into www
        script: |
          cd app
          npm run build:web

      - name: Add iOS platform if missing
        script: |
          cd app
          [ -d ios ] || npx cap add ios

      - name: Capacitor sync (iOS)
        script: |
          cd app
          npx cap sync ios

      - name: Force iPhone-only build settings
        script: |
          cd app
          node scripts/force-ios-iphone-only.js

      - name: Patch Info.plist (privacy strings, encryption flag, unique build number)
        script: |
          cd app/ios/App/App
          PL="Info.plist"

          set_string() {
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PL" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PL"
          }

          set_bool() {
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PL" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :$1 bool $2" "$PL"
          }

          set_string NSCameraUsageDescription "يستخدم التطبيق الكاميرا لالتقاط صور القبور وإضافتها بواسطة الموظفين."
          set_string NSPhotoLibraryUsageDescription "يستخدم التطبيق معرض الصور لاختيار صور القبور وإضافتها بواسطة الموظفين."
          set_string NSPhotoLibraryAddUsageDescription "يحفظ التطبيق الصور في معرض الصور عند الحاجة."
          set_string NSLocationWhenInUseUsageDescription "يستخدم التطبيق موقعك لعرض القبور القريبة وإرشادك إلى موقع القبر على الخريطة."

          set_bool ITSAppUsesNonExemptEncryption false
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER:-2}" "$PL" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD_NUMBER:-2}" "$PL"
          # Marketing version must be HIGHER than the already-approved App Store version (1.0),
          # otherwise App Store Connect rejects the upload with ITMS-90062. Bump to 1.0.1 for
          # the native update. (TestFlight accepts many builds under one version string.)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" "$PL" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.1" "$PL"

          /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$PL"

          /usr/libexec/PlistBuddy -c "Set :UIStatusBarStyle UIStatusBarStyleLightContent" "$PL" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" "$PL"
          set_bool UIViewControllerBasedStatusBarAppearance false

          echo "---- Info.plist privacy/version/device keys after patch ----"
          for k in NSCameraUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription NSLocationWhenInUseUsageDescription ITSAppUsesNonExemptEncryption CFBundleVersion UIStatusBarStyle UIViewControllerBasedStatusBarAppearance UIDeviceFamily; do
            echo "$k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$PL" 2>/dev/null)"
          done

      - name: Install CocoaPods
        script: |
          cd app/ios/App
          pod install

      - name: Set up code signing (persistent App Store cert — never revoke)
        script: |
          keychain initialize

          # Local-only cleanup of downloaded signing files. This clears files on
          # the CI machine ONLY — it does NOT revoke anything on Apple's side.
          rm -rf "$HOME/Library/MobileDevice/Certificates" \
                 "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/MobileDevice/Certificates" \
                   "$HOME/Library/MobileDevice/Provisioning Profiles"

          # Persistent distribution private key (base64-encoded PEM) supplied via
          # a Codemagic SECURE environment variable. Reusing the SAME key on every
          # build keeps the SAME App Store distribution certificate, so a build
          # that was already submitted is NEVER invalidated by a later build.
          #
          # ROOT CAUSE of the 1.0 (14) rejection (ITMS-90035 "invalid signature"):
          # the previous flow REVOKED every distribution certificate at the start
          # of each build, then created a throwaway one. So the next iOS build that
          # ran after build 14 had been uploaded revoked build 14's certificate —
          # which invalidated its signature when Apple validated it at review time.
          # Fix = persistent key + NO revoke (only the App Store profile is fetched
          # / created; the certificate is reused).
          echo "$IOS_DIST_CERT_KEY_B64" | base64 --decode > /tmp/cert_key.pem

          # Reuse the App Store distribution certificate that matches this key, or
          # create it ONCE on the first run. No revoke → past builds stay valid.
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key @file:/tmp/cert_key.pem --verbose
          echo "---- Downloaded signing files ----"
          find "$HOME/Library" -name '*.p12' -o -name '*.mobileprovision' -o -name '*.provisionprofile'
          keychain add-certificates
          xcode-project use-profiles

      - name: Re-apply iPhone-only after signing profile update
        script: |
          cd app
          node scripts/force-ios-iphone-only.js

      - name: Build signed IPA
        script: |
          cd app/ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App

      # - name: Publish Capgo bundle (light OTA updates, post-approval)
      #   script: |
      #     cd app
      #     npx @capgo/cli bundle upload --channel production --apikey "$CAPGO_TOKEN" || true

    artifacts:
      - app/ios/App/build/ios/ipa/*.ipa
      - app/ios/App/build/ios/ipa/*.pkg
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
