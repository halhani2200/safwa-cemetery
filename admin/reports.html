<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>بلاغات الأخطاء - مقبرة صفوى</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">🕌</div>
            <div><div class="sidebar-title">مقبرة صفوى</div><div class="sidebar-subtitle" id="userBadge">...</div></div>
        </div>
        <nav class="sidebar-nav">
            <a href="/admin/" class="nav-link"><span>📊</span><span>الرئيسية</span></a>
            <a href="/admin/graves.html" class="nav-link"><span>🪦</span><span>إدارة القبور</span></a>
            <a href="/staff/add.html" class="nav-link"><span>➕</span><span>إضافة قبر</span></a>
            <a href="/map.html" class="nav-link" target="_blank"><span>🗺️</span><span>خريطة المقبرة</span></a>
            <a href="/admin/announcements.html" class="nav-link"><span>⚰️</span><span>إعلانات الوفاة</span></a>
            <a href="/admin/users.html" class="nav-link"><span>👥</span><span>المستخدمون</span></a>
            <a href="/admin/audit.html" class="nav-link"><span>📋</span><span>سجل النشاط</span></a>
            <a href="/admin/reports.html" class="nav-link active"><span>📝</span><span>بلاغات الأخطاء</span></a>
            <a href="/admin/settings.html" class="nav-link"><span>⚙️</span><span>الإعدادات</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="/" class="nav-link"><span>🌐</span><span>عرض الموقع</span></a>
            <button onclick="logout()" class="nav-link logout-btn"><span>🚪</span><span>تسجيل الخروج</span></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>📝 بلاغات الأخطاء</h1>
            <p>البلاغات اللي أرسلها الزوار عن أخطاء في معلومات القبور</p>
        </div>

        <div class="card">
            <div id="reportsArea"><div class="loading">جاري التحميل...</div></div>
        </div>
    </main>
</div>

<script src="/admin/admin.js"></script>
<script>
async function loadReports() {
    try {
        const r = await fetch('/api/reports');
        const data = await r.json();
        render(data.results || []);
    } catch (e) {
        document.getElementById('reportsArea').innerHTML = '<div class="empty">❌ خطأ</div>';
    }
}

function render(reports) {
    const area = document.getElementById('reportsArea');
    if (reports.length === 0) {
        area.innerHTML = '<div class="empty"><div class="empty-icon">🎉</div>لا توجد بلاغات حالياً</div>';
        return;
    }
    area.innerHTML = reports.map(r => `
        <div style="background:var(--cream);border-radius:10px;padding:14px;margin-bottom:10px;border-right:4px solid ${r.status === 'pending' ? '#F59E0B' : '#10B981'}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px">
                <div>
                    <strong>${escapeHtml(r.grave_name || 'قبر #' + r.grave_id)}</strong>
                    <span class="badge ${r.status === 'pending' ? 'badge-pending' : 'badge-resolved'}">${r.status === 'pending' ? 'جديد' : 'تم'}</span>
                </div>
                <small style="color:var(--text-medium)">${new Date(r.created_at).toLocaleString('ar-EG')}</small>
            </div>
            <p style="margin:6px 0">${escapeHtml(r.description)}</p>
            ${r.reporter_name || r.reporter_phone ? `<small style="color:var(--text-medium)">من: ${escapeHtml(r.reporter_name || 'مجهول')}${r.reporter_phone ? ' | ' + escapeHtml(r.reporter_phone) : ''}</small>` : ''}
            <div style="margin-top:10px;display:flex;gap:8px">
                <a href="/admin/graves.html" class="btn btn-secondary" style="padding:6px 12px;font-size:0.85rem">عرض القبر</a>
                ${r.status === 'pending' ? `<button class="btn btn-gold" style="padding:6px 12px;font-size:0.85rem" onclick="resolveReport(${r.id})">✓ تعليم كمعالج</button>` : ''}
            </div>
        </div>
    `).join('');
}

async function resolveReport(id) {
    try {
        const r = await fetch(`/api/reports/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'resolved' })
        });
        const data = await r.json();
        if (data.ok) { showToast('✅ تم'); loadReports(); }
    } catch (e) { showToast('❌ خطأ', true); }
}

loadReports();
</script>
</body>
</html>
